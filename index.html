<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1113" />
    <meta name="description" content="Jan Kevin B. Dionaldo is a security-minded software engineer building clear, dependable digital systems." />
    <meta property="og:title" content="Jan Kevin B. Dionaldo | Security-minded software engineer" />
    <meta property="og:description" content="Web development, secure coding, and practical automation for dependable digital systems." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/main_picture/kevin.JPG" />
    <link rel="icon" href="/images/head_logo/transs-W.png" />
    <style>
      html[data-boot="active"],
      html[data-boot="active"] body {
        background: #0b1113;
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var key = "jk-booted";
        var stored = false;
        try {
          stored = sessionStorage.getItem(key) === "1";
        } catch (_) {}
        root.dataset.boot = stored ? "done" : "active";
        if (!stored) {
          var complete = function () {
            root.dataset.boot = "done";
            try {
              sessionStorage.setItem(key, "1");
            } catch (_) {}
          };
          window.setTimeout(complete, 4500);
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "hidden") complete();
          });
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            complete();
          }
        }
      })();
    </script>
    <title>Jan Kevin B. Dionaldo | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
